# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qoriq-bsp-release"
BBFILE_PATTERN_qoriq-bsp-release := "^${LAYERDIR}/"
BBFILE_PRIORITY_qoriq-bsp-release = "8"
LAYERSERIES_COMPAT_qoriq-bsp-release = "honister kirkstone langdale mickledore master nanbield scarthgap styhead walnascar"

LAYERSERIES_COMPAT_virtualization-layer:append = " walnascar"
LAYERSERIES_COMPAT_cloud-services-layer:append = " walnascar"

HOSTTOOLS_NONFATAL:append = " whoami sha384sum xxd realpath"

# debug-tweaks image feature is now removed from walnascar
EXTRA_IMAGE_FEATURES:remove = "debug-tweaks"
MACHINE_FEATURES:append = " \
    allow-empty-password \
    allow-root-login \
    empty-root-password \
    post-install-logging \
"

